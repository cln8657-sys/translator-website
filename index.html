<!DOCTYPE html>
<html>
<head>
    <title>Translator Website</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 100px;
        }

        button {
            margin-top: 10px;
            padding: 8px 15px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Simple Translator</h2>

    <textarea id="text" placeholder="Masukkan teks"></textarea><br>
    <button onclick="translateText()">Translate</button>

    <p id="result"></p>
</div>

<script>
async function translateText() {
    const text = document.getElementById("text").value;

    const response = await fetch("https://libretranslate.de/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            q: text,
            source: "auto",
            target: "en",
            format: "text"
        })
    });

    const data = await response.json();
    document.getElementById("result").innerText = data.translatedText;
}
</script>

</body>
</html>
